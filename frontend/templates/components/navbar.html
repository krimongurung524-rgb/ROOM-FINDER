{% load static %}
<nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <i class="fa-solid fa-house-chimney"></i>
            <span>Room<b>Finder</b></span>
        </a>

        <div class="nav-links" id="navLinks">
            {% if user.is_authenticated %}
            <a href="{% url 'accounts:dashboard' %}" class="nav-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>

            <div class="nav-profile-dropdown">
                <button class="nav-profile-btn" id="profileDropdownBtn">
                    <img src="{% if user.profile_image %}{{ user.profile_image.url }}{% else %}https://ui-avatars.com/api/?name={{ user.username }}&background=6366f1&color=fff{% endif %}"
                        class="nav-avatar" alt="profile">
                    <span>{{ user.first_name|default:user.username }}</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="nav-dropdown-menu" id="dropdownMenu">
                    <a href="{% url 'accounts:profile' %}"><i class="fa-solid fa-user"></i> My Profile</a>
                    <a href="{% url 'accounts:dashboard' %}"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                    <a href="{% url 'accounts:change_password' %}"><i class="fa-solid fa-lock"></i> Change Password</a>
                    <hr>
                    <a href="{% url 'accounts:logout' %}" class="logout-link"><i
                            class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </div>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="nav-link">Login</a>
            <a href="{% url 'accounts:register' %}" class="btn-nav-register">Get Started</a>
            {% endif %}
        </div>

        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </div>
</nav>

<script>
    document.getElementById('profileDropdownBtn')?.addEventListener('click', function (e) {
        e.stopPropagation();
        document.getElementById('dropdownMenu').classList.toggle('active');
    });
    document.addEventListener('click', function () {
        document.getElementById('dropdownMenu')?.classList.remove('active');
    });
    document.getElementById('navToggle')?.addEventListener('click', function () {
        document.getElementById('navLinks').classList.toggle('active');
    });
</script>
